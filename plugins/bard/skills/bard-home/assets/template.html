<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BARD · Bonhams Auction Research Database</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prata&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  /* Bonhams palette: black, white, violet accent */
  --bg: #FFFFFF;
  --surface: #F6F5F5;
  --ink: #000000;
  --muted: #5A5A5A;
  --rule: #DEDEDE;
  --rule-strong: #000000;
  --tray: #F2F2F2;          /* neutral band */
  --tray-2: #FFFFFF;
  --tray-line: #D4D4D4;
  --tray-line-strong: #000000;
  --tray-ink: #000000;
  --tray-muted: #5A5A5A;
  --tray-accent: #8231A8;   /* purple highlight on the band */
  --yellow: __YELLOW__;
  --yellow-ink: #000000;
  --yellow-soft: #FFF6CC;
  --bonhams: #8231A8;
  --bonhams-soft: #F1E7F6;
  --bonhams-on-tray: #8231A8;
  --c1: #3F3F3F;
  --c2: #8A8A8A;
  --c3: #C7C7C7;
  --below: #5E5E5E;
  --within: #CFCFCF;
  --above: #8231A8;
  --down-on-tray: #A8362B;
  --warn-bg: #F6F5F5;
  --warn-ink: #3A3A3A;
  --focus: #8231A8;
  --display: "SangBleu Republic", "SangBleu Kingdom", "SangBleu Empire", "Prata", "Didot", "Bodoni 72", Georgia, serif;
  --text: "SangBleu Sunrise", "Hanken Grotesk", "Helvetica Neue", Arial, system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F0F0F; --surface: #1A1A1A; --ink: #F2F2F2; --muted: #A6A6A6; --rule: #2E2E2E; --rule-strong: #F2F2F2;
    --tray: #1A1A1A; --tray-2: #242424; --tray-line: #3A3A3A; --tray-line-strong: #E6E6E6; --tray-ink: #FFFFFF; --tray-muted: #B3B3B3; --tray-accent: #C9A2E3;
    --bonhams: #B57BD6; --bonhams-soft: #2B1D33; --bonhams-on-tray: #C9A2E3; --down-on-tray: #F0B3AA; --yellow-soft: #332B0A;
    --c1: #D0D0D0; --c2: #8C8C8C; --c3: #555555;
    --below: #8C8C8C; --within: #3D3D3D; --above: #B57BD6;
    --warn-bg: #1A1A1A; --warn-ink: #D9D9D9; --focus: #C9A2E3;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F0F0F; --surface: #1A1A1A; --ink: #F2F2F2; --muted: #A6A6A6; --rule: #2E2E2E; --rule-strong: #F2F2F2;
  --tray: #1A1A1A; --tray-2: #242424; --tray-line: #3A3A3A; --tray-line-strong: #E6E6E6; --tray-ink: #FFFFFF; --tray-muted: #B3B3B3; --tray-accent: #C9A2E3;
  --bonhams: #B57BD6; --bonhams-soft: #2B1D33; --bonhams-on-tray: #C9A2E3; --down-on-tray: #F0B3AA; --yellow-soft: #332B0A;
  --c1: #D0D0D0; --c2: #8C8C8C; --c3: #555555;
  --below: #8C8C8C; --within: #3D3D3D; --above: #B57BD6;
  --warn-bg: #1A1A1A; --warn-ink: #D9D9D9; --focus: #C9A2E3;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--text); font-size: 15px; line-height: 1.5;
  font-variant-numeric: tabular-nums lining-nums;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration-color: color-mix(in srgb, currentColor 35%, transparent); text-underline-offset: 3px; }
a:hover { color: var(--bonhams); text-decoration-color: currentColor; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 2px; }
button, input, select, textarea { font: inherit; color: inherit; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 28px; }
@media (max-width: 640px) { .wrap { padding: 0 18px; } }

/* ---------- masthead + tray (black band) ---------- */
.tray { background: var(--tray); color: var(--tray-ink); }
.masthead { display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; padding: 22px 0 18px; border-bottom: 1px solid var(--tray-line); }
.brand { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; min-width: 0; }
.brand h1 { font-family: var(--display); font-weight: 400; font-size: 34px; line-height: 1; margin: 0; letter-spacing: 0.08em; }
.brand p { margin: 0; color: var(--tray-muted); font-size: 14px; }
.controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--tray-line-strong); border-radius: 0; padding: 0; }
.seg button { border: 0; background: transparent; color: var(--tray-muted); padding: 7px 14px; border-radius: 0; cursor: pointer; font-size: 13.5px; }
.seg button + button { border-left: 1px solid var(--tray-line-strong); }
.seg button[aria-pressed="true"] { background: var(--yellow); color: var(--yellow-ink); font-weight: 600; }
.tray :focus-visible { outline-color: var(--tray-accent); }
.seg.small button { padding: 5px 11px; font-size: 13px; }
.status { display: flex; align-items: center; gap: 10px; padding: 10px 0 0; font-size: 13px; color: var(--tray-muted); min-height: 34px; flex-wrap: wrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--tray-muted); flex: none; }
.dot.live { background: var(--bonhams-on-tray); }
.dot.busy { background: var(--tray-accent); animation: pulse 1.2s ease-in-out infinite; }
.dot.warn { background: var(--down-on-tray); }
@keyframes pulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .dot.busy { animation: none; } }
.linkbtn { background: none; border: 0; padding: 0; color: var(--tray-ink); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: 13px; }
.linkbtn[disabled] { opacity: .5; cursor: default; }

.traybody { padding: 22px 0 32px; }
.tray h2 { font-family: var(--display); font-weight: 400; font-size: 28px; line-height: 1.2; margin: 0 0 6px; }
.tray .lede { color: var(--tray-muted); margin: 0 0 20px; max-width: 66ch; font-size: 14.5px; }

/* comps builder */
.builder { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 28px; }
@media (max-width: 860px) { .builder { grid-template-columns: minmax(0, 1fr); } }
.fields { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px 16px; }
.fields .full { grid-column: 1 / -1; }
@media (max-width: 480px) { .fields { grid-template-columns: minmax(0, 1fr); } }
.field label { display: block; font-size: 13px; color: var(--tray-muted); margin-bottom: 5px; }
.field input, .field select, .field textarea {
  width: 100%; background: var(--tray-2); border: 1px solid var(--tray-line);
  border-radius: 0; padding: 9px 11px; color: var(--tray-ink);
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--tray-accent); outline: none; box-shadow: 0 0 0 1px var(--tray-accent); }
.field textarea { resize: vertical; min-height: 64px; }
.field .range { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 6px; align-items: center; }
.field .range .dash { color: var(--tray-muted); }
.field input::placeholder, .field textarea::placeholder { color: #8A8A8A; }
.request { background: var(--tray-2); border: 1px solid var(--tray-line); border-top: 4px solid var(--tray-accent); padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.request .label { font-size: 13px; color: var(--tray-muted); }
.request pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--text); font-size: 14.5px; line-height: 1.55; color: var(--tray-ink); max-height: 260px; overflow: auto; }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--yellow); border-radius: 0; padding: 9px 20px; cursor: pointer; font-weight: 600; background: var(--yellow); color: var(--yellow-ink); letter-spacing: 0.02em; }
.btn:hover { background: #000000; border-color: #000000; color: var(--yellow); }
.request .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.request .hint { font-size: 13px; color: var(--tray-muted); }
.btn.ghost { background: transparent; color: var(--tray-ink); border-color: var(--tray-line-strong); }
.btn.ghost:hover { background: var(--tray-ink); color: var(--tray); border-color: var(--tray-ink); }
.btn[disabled] { opacity: .5; cursor: default; }

/* chat */
.chat { margin-top: 24px; background: var(--tray-2); border: 1px solid var(--tray-line); border-top: 4px solid var(--yellow); min-width: 0; }
.chat .chathead { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 18px; border-bottom: 1px solid var(--tray-line); }
.chat .chathead h3 { font-family: var(--display); font-weight: 400; font-size: 20px; margin: 0; }
.chat .chathead p { margin: 0; font-size: 13px; color: var(--tray-muted); }
.msgs { padding: 6px 18px; max-height: 560px; overflow-y: auto; }
.msg { padding: 14px 0; border-bottom: 1px solid var(--tray-line); min-width: 0; }
.msg:last-child { border-bottom: 0; }
.msg .who { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--tray-muted); margin-bottom: 6px; }
.msg.user .body { white-space: pre-wrap; overflow-wrap: anywhere; color: var(--tray-muted); font-size: 14px; }
.msg.bot .body { font-size: 14.5px; line-height: 1.6; overflow-wrap: anywhere; }
.msg.bot .body p { margin: 0 0 10px; }
.msg.bot .body h4 { font-family: var(--display); font-weight: 400; font-size: 17px; margin: 14px 0 6px; }
.msg.bot .body ul, .msg.bot .body ol { margin: 0 0 10px; padding-left: 20px; }
.msg.bot .body .tablewrap { margin: 6px 0 12px; }
.msg.bot .body table { font-size: 13px; }
.msg.bot .body th, .msg.bot .body td { white-space: normal; text-align: left; min-width: 64px; vertical-align: top; }
.msg.bot .body code { font-size: 13px; background: var(--tray); padding: 0 4px; }
.msg .note { font-size: 13px; color: var(--tray-muted); margin-top: 6px; }
.msg .tools { display: flex; gap: 12px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
.msg .tools .hint { font-size: 13px; color: var(--tray-muted); }
.msg .think { color: var(--tray-muted); font-size: 14px; }
.composer { display: flex; gap: 10px; align-items: flex-end; padding: 12px 18px 16px; border-top: 1px solid var(--tray-line); flex-wrap: wrap; }
.composer textarea { flex: 1 1 260px; min-height: 44px; max-height: 180px; resize: vertical; background: var(--tray); border: 1px solid var(--tray-line); padding: 9px 11px; color: var(--tray-ink); border-radius: 0; }
.composer textarea:focus { border-color: var(--tray-accent); outline: none; box-shadow: 0 0 0 1px var(--tray-accent); }

/* headline figures — sized to their container so values never collide */
.figures { container-type: inline-size; display: grid; grid-template-columns: minmax(0, 1.4fr) repeat(3, minmax(0, 1fr)); gap: 0; }
.fig { min-width: 0; padding: 0 22px; border-left: 1px solid var(--tray-line); }
.fig:first-child { padding-left: 0; border-left: 0; }
.fig .k { font-size: 13px; color: var(--tray-muted); margin-bottom: 6px; }
.fig .v { font-family: var(--display); font-weight: 400; font-size: clamp(22px, 3.1cqi, 34px); line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fig.hero .v { font-size: clamp(30px, 4.6cqi, 50px); color: var(--tray-accent); }
.fig .s { font-size: 13px; color: var(--tray-muted); margin-top: 6px; }
.fig .s b { color: var(--tray-ink); font-weight: 600; }
@media (max-width: 900px) {
  .figures { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); row-gap: 22px; }
  .fig { padding: 0 16px; }
  .fig:nth-child(odd) { padding-left: 0; border-left: 0; }
  .fig.hero { grid-column: 1 / -1; padding: 0 0 18px; border-bottom: 1px solid var(--tray-line); }
  .fig:nth-child(2) { padding-left: 0; border-left: 0; }
  .fig:nth-child(3) { padding-left: 16px; border-left: 1px solid var(--tray-line); }
  .fig:nth-child(4) { grid-column: 1 / -1; padding-left: 0; border-left: 0; }
  .fig .v { font-size: clamp(22px, 6.4cqi, 32px); }
  .fig.hero .v { font-size: clamp(30px, 9cqi, 46px); }
}
.up, .fig .s b.up { color: var(--bonhams-on-tray); }
.down, .fig .s b.down { color: var(--down-on-tray); }
.trayhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }

/* ---------- white sections ---------- */
main { padding: 4px 0 40px; }
section.block { padding: 34px 0 6px; }
section.block + section.block { border-top: 1px solid var(--rule); }
.blockhead { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.blockhead > div { min-width: 0; }
.blockhead h3 { font-family: var(--display); font-weight: 400; font-size: 24px; line-height: 1.25; margin: 0; }
.blockhead p { margin: 4px 0 0; color: var(--muted); max-width: 72ch; font-size: 14px; }
.seg.plain { border-color: var(--rule-strong); }
.seg.plain button { color: var(--muted); }
.seg.plain button + button { border-left-color: var(--rule-strong); }
.seg.plain button[aria-pressed="true"] { background: var(--yellow); color: var(--yellow-ink); }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 36px; }
@media (max-width: 900px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }

/* lots list */
.chips { display: flex; gap: 0; flex-wrap: wrap; border: 1px solid var(--rule-strong); }
.chip { border: 0; background: transparent; padding: 6px 13px; font-size: 13px; cursor: pointer; color: var(--muted); }
.chip + .chip { border-left: 1px solid var(--rule-strong); }
.chip[aria-pressed="true"] { background: var(--yellow); color: var(--yellow-ink); font-weight: 600; }
.lots { list-style: none; margin: 0; padding: 0; }
.lot { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 24px; padding: 16px 0; border-bottom: 1px solid var(--rule); }
.lot:first-child { border-top: 1px solid var(--rule-strong); }
.lot.is-b { box-shadow: inset 4px 0 0 var(--yellow); padding-left: 16px; }
.lot .title { font-family: var(--display); font-size: 17px; line-height: 1.35; overflow-wrap: anywhere; }
.lot .meta { font-size: 13px; color: var(--muted); margin-top: 3px; overflow-wrap: anywhere; }
.lot .house-b { color: var(--bonhams); font-weight: 600; }
.lot .price { text-align: right; font-size: 14px; white-space: nowrap; }
.lot .price .big { font-size: 16px; font-weight: 600; }
.lot .price .sub { color: var(--muted); font-size: 13px; }
@media (max-width: 620px) { .lot { grid-template-columns: minmax(0, 1fr); } .lot .price { text-align: left; white-space: normal; } }
.band { display: inline-block; font-size: 12px; padding: 1px 8px; margin-left: 6px; vertical-align: 1px; border: 1px solid currentColor; }
.band.Above { color: var(--bonhams); }
.band.Within { color: var(--muted); }
.band.Below { color: var(--ink); }

/* estimate bars */
.est { display: grid; grid-template-columns: 108px minmax(0, 1fr) 58px; gap: 10px 14px; align-items: center; font-size: 14px; }
.est .t { color: var(--ink); min-width: 0; }
.est .n { font-size: 12px; color: var(--muted); display: block; }
.stack { display: flex; height: 22px; overflow: hidden; background: var(--rule); }
.stack span { display: flex; align-items: center; justify-content: center; font-size: 11.5px; color: #fff; min-width: 0; overflow: hidden; white-space: nowrap; }
.stack .b { background: var(--below); } .stack .w { background: var(--within); color: #111; } .stack .a { background: var(--above); }
.est .m { text-align: right; color: var(--muted); font-size: 13px; }
@media (max-width: 480px) { .est { grid-template-columns: 84px minmax(0, 1fr) 46px; gap: 10px 10px; } }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 14px; }
.legend i { display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: -1px; }
.callout { margin-top: 18px; padding: 12px 14px; border-left: 4px solid var(--yellow); background: var(--yellow-soft); font-size: 14px; }

/* rules */
.rules { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px; }
@media (max-width: 860px) { .rules { grid-template-columns: minmax(0, 1fr); } }
.rules h4 { font-family: var(--display); font-weight: 400; font-size: 18px; margin: 0 0 6px; }
.rules p { margin: 0; color: var(--muted); font-size: 14px; max-width: 46ch; }

/* share bars */
.share { display: grid; grid-template-columns: 44px minmax(0, 1fr) 52px; gap: 12px 12px; align-items: center; }
.share .fy { font-size: 14px; color: var(--muted); }
.share .bshare { font-size: 14px; font-weight: 600; color: var(--bonhams); text-align: right; }
.sbar { display: flex; height: 32px; overflow: hidden; min-width: 0; }
.sbar span { display: flex; align-items: center; padding: 0 8px; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: clip; min-width: 0; }
.sbar span .nm { display: inline; padding: 0; }
@media (max-width: 600px) { .sbar span .nm { display: none; } }
.h-Bonhams { background: var(--bonhams); color: #fff; }
.h-Christies { background: var(--c1); color: #fff; }
.h-Sothebys { background: var(--c2); color: #111; }
.h-Phillips { background: var(--c3); color: #111; }
:root[data-theme="dark"] .h-Christies { color: #111; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .h-Christies { color: #111; } :root:not([data-theme="light"]) .h-Phillips { color: #fff; } }
.basis { font-size: 13px; color: var(--muted); margin-top: 12px; }

/* tables */
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: right; padding: 9px 10px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
thead th { border-bottom: 1px solid var(--rule-strong); }
th:first-child, td:first-child { text-align: left; padding-left: 0; }
thead th { font-weight: 500; color: var(--muted); font-size: 13px; }
td .sh { display: block; font-size: 12px; color: var(--muted); }
td.bonhams, th.bonhams { color: var(--bonhams); font-weight: 600; }
td.wrapcell { white-space: normal; min-width: 220px; text-align: left; }

/* trend small multiples */
.multiples { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px 36px; }
@media (max-width: 760px) { .multiples { grid-template-columns: minmax(0, 1fr); } }
.mult h4 { margin: 0 0 2px; font-size: 14px; font-weight: 600; }
.mult .peak { font-size: 12px; color: var(--muted); margin: 0 0 6px; }
.mult svg { width: 100%; height: 86px; display: block; }
.mult .axis { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); margin-top: 4px; }

/* notes */
.notes { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.notes li { font-size: 14px; color: var(--muted); display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 12px; }
.notes li b { color: var(--ink); font-weight: 600; }
footer { border-top: 1px solid var(--rule-strong); padding: 18px 0 34px; font-size: 13px; color: var(--muted); }
footer .wrap { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="tray">
  <div class="wrap">
    <header class="masthead">
      <div class="brand">
        <h1>BARD</h1>
        <p>Bonhams Auction Research Database</p>
      </div>
      <div class="controls">
        <div class="seg" role="group" aria-label="View">
          <button type="button" data-role="specialist">Specialist</button>
          <button type="button" data-role="management">Management</button>
        </div>
        <div class="seg small" role="group" aria-label="Currency">
          <button type="button" data-ccy="USD">USD</button>
          <button type="button" data-ccy="AUD">AUD</button>
        </div>
      </div>
    </header>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <div class="traybody" id="tray"></div>
  </div>
</div>
<main class="wrap" id="main"></main>
<footer><div class="wrap"><span id="basis"></span><span>Powered by Investair</span></div></footer>

<script>
const SNAPSHOT = __SNAPSHOT__;
const MODEL_SQL = __MODEL_SQL__;
const PROJECT_ID = __PROJECT_ID__;
const SERVER = __SERVER__;
const TOOL = "execute_sql";

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);

    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.appendChild(typeof kid === "string" || typeof kid === "number" ? document.createTextNode(String(kid)) : kid);
  }
  return el;
}

}

/* ---------- live data ---------- */
let mcp = null, loading = false;
function extractModel(result) {
  let p = result && typeof result === "object" && "payload" in result ? result.payload : result;
  let text = null;
  if (typeof p === "string") text = p;
  else if (p && typeof p.result === "string") text = p.result;
  else if (p && typeof p === "object" && p.model) return p.model;
  else if (Array.isArray(p) && p[0] && p[0].model) return p[0].model;
  if (text == null && result && Array.isArray(result.content)) text = result.content.filter(b => b.type === "text").map(b => b.text).join("\n");
  if (text == null) throw Object.assign(new Error("No text in result"), { code: "parse" });
  const m = text.match(/<untrusted-data-[^>]*>\s*([\s\S]*?)\s*<\/untrusted-data-/);
  const body = JSON.parse(m ? m[1] : text);
  const model = Array.isArray(body) ? body[0] && body[0].model : (body.model || body);
  if (!model || model.v !== 1 || !Array.isArray(model.meta)) throw Object.assign(new Error("Unexpected shape"), { code: "parse" });
  return model;
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
function looksAsleep(e) { return /paus|inactive|restor|resum|not ready|coming up|503|timeout/i.test((e && e.message) || ""); }

async function loadLive(force) {
  if (!mcp || loading) return;
  loading = true;
  setStatus("busy", state.source === "live" ? "Refreshing live data…" : "Loading live data from BARD…");
  const call = () => runSql(MODEL_SQL,
    { cache: force ? { staleTime: 300000, gcTime: 86400000, refresh: true } : { staleTime: 300000, gcTime: 86400000 } });
  let attempt = 0;
  while (true) {
    try {
      const res = await call();
      const model = extractModel(res);
      state.model = model; state.source = "live";
      state.liveAt = res && res.cache && res.cache.storedAt ? new Date(res.cache.storedAt) : new Date();
      loading = false;
      setStatus("live", `Live data · updated ${state.liveAt.toLocaleTimeString("en-AU", { hour: "numeric", minute: "2-digit" })}`, { label: "Refresh", fn: () => loadLive(true) });
      render();
      return;
    } catch (e) {
      const code = e && e.code;
      const retryable = e && (e.retryable || code === "tool_error" || code === "server_unavailable") && code !== "parse";
      if (attempt === 0 && retryable) {
        attempt++;
        setStatus("busy", code === "tool_error" || looksAsleep(e) ? "Waking the database — this can take up to a minute the first time each day…" : "BARD didn't answer. Trying once more…");
        await sleep((e.retryAfterMs || 7000) + Math.random() * 3000);
        continue;
      }
      loading = false;
      handleLiveError(e);
      return;
    }
  }
}
function handleLiveError(e) {
  const code = (e && e.code) || "upstream_error";
  const snap = `Showing the saved snapshot from ${fmtDate(SNAPSHOT.generated_at.slice(0, 10))}.`;
  const retry = { label: "Try again", fn: () => loadLive(true) };
  const msgs = {
    server_not_connected: [`Add the Supabase connector in claude.ai Settings → Connectors to see live data. ${snap}`, null],
    needs_reauth: [`Reconnect Supabase in claude.ai Settings → Connectors to see live data. ${snap}`, retry],
    selection_required: [`Choose which Supabase connection to use when claude.ai asks, then try again. ${snap}`, retry],
    not_in_manifest: [`Live data is turned off for this page. ${snap}`, null],
    not_granted: [`Live data isn't available in this view. ${snap}`, null],
    capability_disabled: [`Live data isn't available in this view. ${snap}`, null],
    capability_removed: [`Live data isn't available in this view. ${snap}`, null],
    blocked_by_policy: [`Your organisation's settings block this database query. ${snap}`, null],
    approval_required: [`Your organisation requires approval for this query. ${snap}`, null],
    parse: [`Live data came back in an unexpected format. ${snap}`, retry],
    tool_error: [`BARD reported an error: ${(e && e.message || "").slice(0, 140)} ${snap}`, retry],
    server_unavailable: [`BARD didn't respond. ${snap}`, retry]
  };
  const [text, action] = msgs[code] || [`Couldn't load live data (${code}). ${snap}`, retry];
  if (["needs_reauth", "server_not_connected", "blocked_by_policy", "not_in_manifest"].includes(code)) { state.model = SNAPSHOT; state.source = "snapshot"; render(); }
  setStatus("warn", text, action);
}

// Project-scoped connectors (URL carries project_ref) take {query}; the generic
// Supabase connector also needs project_id. Try one shape, flip once if refused.
let sqlWithProject = true;
async function runSql(query, opts) {
  const args = () => sqlWithProject ? { project_id: PROJECT_ID, query } : { query };
  try { return await mcp.callTool(SERVER, TOOL, args(), opts); }
  catch (e) {
    const m = (e && e.message) || "";
    const shapeErr = (e && (e.code === "tool_error" || e.code === "bad_request")) &&
      /project_id|additional propert|unrecognized|unexpected (key|field|propert)|must not have|required/i.test(m);
    if (!shapeErr) throw e;
    sqlWithProject = !sqlWithProject;
    return await mcp.callTool(SERVER, TOOL, args(), opts);
  }
}
function resultText(res) {
  const p = res && typeof res === "object" && "payload" in res ? res.payload : res;
  let text = typeof p === "string" ? p : (p && typeof p.result === "string") ? p.result : null;
  if (text == null && res && Array.isArray(res.content)) text = res.content.filter(b => b.type === "text").map(b => b.text).join("\n");
  if (text == null) text = JSON.stringify(p);
  const m = text.match(/<untrusted-data-[^>]*>\s*([\s\S]*?)\s*<\/untrusted-data-/);
  return m ? m[1] : text;
}

const CHAT_RULES = `You are a jewellery research assistant inside BARD, the Bonhams Auction Research Database. A Bonhams specialist is asking for comparable sales and an estimate for a piece.

Use the query_bard tool to read the archive. It runs ONE read-only Postgres SELECT (or WITH ... SELECT) and returns rows as JSON.

Main table: public."Auction_results" (quote the name). Columns: auction_house ('Bonhams','Christies','Sothebys','Phillips'), auction_name, auction_date (ISO text 'YYYY-MM-DD'), lot_number, lot_title, lot_description (free text: stones, carats, metal, maker, period), est_low, est_high, hammer_price (Bonhams only), sold_price (buyer's total), status ('SOLD','NOT_SOLD','UNSOLD' or null), withdrawn, currency ('USD','GBP','HKD','CHF','EUR','AUD','CNY'), lot_url.
USD conversion: bard.fx_v (currency, usd_rate, rate_date) — USD value = price * usd_rate. For AUD divide the USD value by the AUD usd_rate.

How to search:
- Filter status = 'SOLD'. Match with ILIKE on lot_title and lot_description using the 2-4 most distinctive terms; loosen or tighten based on how many rows come back.
- Select only the columns you need, left(lot_description, 300) at most, order by auction_date desc, LIMIT 25 or fewer.
- Carat weights live inside lot_description as text: read them rather than parsing in SQL.
- Two or three queries is usually enough. Never invent a lot, price or date that did not come back from a query.

Answer format (Markdown):
- A one-line summary of the piece as you understood it.
- A table of the closest comparables: house, date, title, estimate, hammer, buyer's total (sale currency), converted value, and the lot link.
- A suggested estimate range, with 2-4 sentences on which comparables it rests on and how they sold against their own estimates.
- One line noting that this uses archive comparables only and needs checking against condition, provenance and current market.
Keep it concise. If few good comparables exist, say so plainly.`;

function queryTool() {
  return {
    name: "query_bard",
    description: "Run one read-only SQL SELECT against the BARD auction archive (Postgres) and get the rows back as JSON text. Keep results small: select few columns and LIMIT 25 or fewer.",
    inputSchema: { type: "object", properties: { sql: { type: "string", description: "A single SELECT or WITH ... SELECT statement. No semicolons inside, no writes." } }, required: ["sql"] },
    async execute(input, ctx) {
      let q = String(input && input.sql || "").trim().replace(/;\s*$/, "");
      if (!/^(select|with)\b/i.test(q)) throw new Error("Only a single SELECT or WITH query is allowed.");
      if (q.includes(";")) throw new Error("Send one statement at a time, without semicolons.");
      if (/\b(insert|update|delete|drop|alter|create|grant|revoke|truncate|copy|vacuum|call|do|set\s+role|pg_read|pg_ls|lo_import|dblink)\b/i.test(q)) throw new Error("That statement isn't allowed. Read-only SELECT queries only.");
      setChatStatus("Searching BARD…");
      const res = await runSql(q, { cache: false, signal: ctx && ctx.signal });
      const text = resultText(res);
      return text.length > 24000 ? text.slice(0, 24000) + "\n…(truncated — select fewer columns or rows)" : text;
    }
  };
}

function setChatStatus(t) { const el = document.getElementById("chat-live"); if (el && !chat.live) el.replaceChildren(h("span", { class: "think", text: t })); }

async function sendChat(text) {
  text = String(text || "").trim();
  if (!text || chat.busy || !sample) return;
  chat.turns.push({ role: "user", content: text });
  chat.busy = true; chat.live = ""; chat.error = "";
  chat.ctl = new AbortController();
  renderChat();
  const keep = chat.turns.slice(-8);                       // instructions turn + recent conversation
  const input = [{ role: "user", content: CHAT_RULES }, ...keep];
  try {
    const opts = { signal: chat.ctl.signal, onText: ({ text }) => { chat.live = text; paintLive(); } };
    if (canSearch()) opts.tools = [queryTool()]; else opts.cache = false;
    const { text: answer, truncated } = await sample(input, opts);
    chat.turns.push({ role: "assistant", content: answer + (truncated ? "\n\n_(Cut short — ask a narrower follow-up.)_" : "") });
  } catch (e) {
    const code = e && e.code;
    if (e && e.text) chat.turns.push({ role: "assistant", content: e.text + (code === "cancelled" ? "\n\n_(Stopped.)_" : "\n\n_(Interrupted.)_") });
    chat.error = ({
      cancelled: "",
      not_granted: "Claude isn't allowed for this page. Allow it when prompted, or copy the request instead.",
      sampling_disabled: "Claude isn't available on this account. Copy the request instead.",
      rate_limited: "Too many requests just now. Wait a moment, then send again.",
      session_expired: "Sign in to Claude again, then send again.",
      refused: "Claude couldn't help with that request. Try rewording it.",
      prompt_too_large: "The conversation is too long. Clear it and start again.",
      tools_unavailable: "This view can't search BARD from the page. Copy the request into Claude instead."
    })[code] ?? "Something went wrong reaching Claude. Send again to retry.";
    if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(code)) sample = null;
  } finally {
    chat.busy = false; chat.live = ""; chat.ctl = null;

  }
}

// Small, safe Markdown: escapes everything, then headings, lists, tables, bold, italics, code, https links.
function mdInline(t) {
  const esc = t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  return esc
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<i>$2</i>")
    .replace(/(^|\s)_\(([^)]*)\)_(?=\s|$)/g, "$1<i>($2)</i>")
    .replace(/\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/(^|[\s(])(https:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer">link</a>');
}
function mdToNodes(md) {
  const out = document.createElement("div");
  const lines = String(md).replace(/\r/g, "").split("\n");
  let i = 0;
  const html = [];
  while (i < lines.length) {
    const ln = lines[i];
    if (/^\s*\|.*\|\s*$/.test(ln) && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1])) {
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => mdInline(c.trim()));
      const head = cells(ln); i += 2; const rows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) rows.push(cells(lines[i++]));
      html.push('<div class="tablewrap"><table><thead><tr>' + head.map(c => `<th>${c}</th>`).join("") + "</tr></thead><tbody>" +
        rows.map(r => "<tr>" + r.map(c => `<td>${c}</td>`).join("") + "</tr>").join("") + "</tbody></table></div>");
      continue;
    }
    if (/^\s*#{1,6}\s+/.test(ln)) { html.push("<h4>" + mdInline(ln.replace(/^\s*#+\s+/, "")) + "</h4>"); i++; continue; }
    if (/^\s*([-*•]|\d+[.)])\s+/.test(ln)) {
      const ordered = /^\s*\d/.test(ln); const items = [];
      while (i < lines.length && /^\s*([-*•]|\d+[.)])\s+/.test(lines[i])) items.push("<li>" + mdInline(lines[i++].replace(/^\s*([-*•]|\d+[.)])\s+/, "")) + "</li>");
      html.push((ordered ? "<ol>" : "<ul>") + items.join("") + (ordered ? "</ol>" : "</ul>"));
      continue;
    }
    if (!ln.trim()) { i++; continue; }
    const para = [];
    while (i < lines.length && lines[i].trim() && !/^\s*(#{1,6}\s|[-*•]\s|\d+[.)]\s|\|)/.test(lines[i])) para.push(mdInline(lines[i++]));
    if (para.length) html.push("<p>" + para.join("<br>") + "</p>"); else i++;
  }
  out.innerHTML = html.join("");
  return out;
}
// Copy an answer for email or a document: rich HTML (tables keep their grid) plus a plain-text version.
function answerPlain(md) {
  return String(md)
    .split("\n").filter(l => !/^\s*\|?\s*:?-{2,}[-|:\s]*$/.test(l))
    .map(l => /^\s*\|.*\|\s*$/.test(l) ? l.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim()).join("\t") : l)
    .join("\n")
    .replace(/^\s*#{1,6}\s+/gm, "")
    .replace(/\*\*([^*]+)\*\*/g, "$1")
    .replace(/(^|\s)_\(([^)]*)\)_/g, "$1($2)")
    .replace(/`([^`]+)`/g, "$1")
    .replace(/\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g, "$1 ($2)");
}
function answerHtml(md) {
  const node = mdToNodes(md);
  node.querySelectorAll("table").forEach(t => t.setAttribute("style", "border-collapse:collapse;font-family:Arial,sans-serif;font-size:13px"));
  node.querySelectorAll("th,td").forEach(c => c.setAttribute("style", "border:1px solid #cccccc;padding:4px 8px;text-align:left;vertical-align:top"));
  node.querySelectorAll("th").forEach(c => c.style.background = "#f2f2f2");
  return `<div style="font-family:Arial,sans-serif;font-size:14px;line-height:1.5">${node.innerHTML}</div>`;
}
async function copyAnswer(md, bodyEl, msgEl) {
  const plain = answerPlain(md);
  try {
    if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
      await navigator.clipboard.write([new ClipboardItem({
        "text/html": new Blob([answerHtml(md)], { type: "text/html" }),
        "text/plain": new Blob([plain], { type: "text/plain" })
      })]);
    } else {
      await navigator.clipboard.writeText(plain);
    }
    msgEl.textContent = "Copied. Paste it into an email or document.";
  } catch (e) {
    try { await navigator.clipboard.writeText(plain); msgEl.textContent = "Copied as plain text."; return; } catch (e2) {}
    const r = document.createRange(); r.selectNodeContents(bodyEl); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    msgEl.textContent = "Selected. Press Ctrl+C (⌘C on Mac) to copy.";
  }
}

/* ---------- comps request ---------- */
function requestText() {
  const f = state.form;
  const parts = [];
  const desc = [f.type.toLowerCase()];
  const lo = parseFloat(f.carat), hi = parseFloat(f.caratMax);
  const hasLo = isFinite(lo) && lo > 0, hasHi = isFinite(hi) && hi > 0;
  const [a, b] = hasLo && hasHi && hi < lo ? [hi, lo] : [lo, hi];
  const ct = hasLo && hasHi && a !== b ? `${a}–${b} ct` : hasLo ? `${lo} ct` : "";
  if (f.stone && f.stone !== "Other / none") desc.unshift(ct ? `${ct} ${f.stone.toLowerCase()}` : f.stone.toLowerCase());
  else if (ct) desc.push(`(${ct})`);
  if (!hasLo && hasHi) desc.push(`with a main stone of up to ${hi} ct`);
  let line = `Using BARD, find comparable sold lots for a ${desc.join(" ")}`;
  if (f.maker.trim()) line += ` by ${f.maker.trim()}`;
  if (f.period.trim()) line += `, ${f.period.trim()}`;
  parts.push(line + ".");
  if (f.condition.trim()) parts.push(`Condition and details: ${f.condition.trim()}`);
  if (hasLo && hasHi && a !== b) parts.push(`Only use comparables whose main stone weighs between ${a} and ${b} carats, and show each comparable's carat weight.`);
  parts.push(`Search all four houses, sold lots only. For each comparable show hammer and buyer's total with a conversion to ${f.show}, flag whether the piece is made by or cased by the maker, and note any lots where the carat weight or quality differs materially.`);
  parts.push(`Then suggest an estimate range, explaining which comparables it rests on.`);
  return parts.join("\n\n");
}

function blockTrend() {
  const cur = new Date(String(M().generated_at).slice(0, 10) + "T00:00:00");
  const months = [];
  for (let i = 23; i >= 0; i--) { const d = new Date(cur.getFullYear(), cur.getMonth() - i, 1); months.push(d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0")); }
  const label = m => { const [y, mo] = m.split("-"); return new Date(+y, +mo - 1, 1).toLocaleDateString("en-AU", { month: "short", year: "2-digit" }); };
  const tiles = HOUSES.map(x => {
    const vals = months.map(m => { const r = (M().trend || []).find(z => z[0] === x && z[1] === m); return r ? Number(r[2]) : 0; });
    const max = Math.max(...vals, 1); const peakI = vals.indexOf(Math.max(...vals));
    const W = 480, H = 86, gap = 3, bw = (W - gap * 23) / 24;
    const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: "none", role: "img", "aria-label": `${HOUSE_NAME[x]} monthly live value, last 24 months` });
    svg.appendChild(s("line", { x1: 0, x2: W, y1: H - 0.5, y2: H - 0.5, stroke: "var(--rule)", "stroke-width": 1 }));
    vals.forEach((v, i) => {
      if (!v) return;
      const bh = Math.max(2, (v / max) * (H - 6));
      const rect = s("rect", { x: i * (bw + gap), y: H - bh, width: bw, height: bh, rx: 1.5, fill: x === "Bonhams" ? "var(--bonhams)" : "var(--c2)" });
      const t = s("title"); t.textContent = `${label(months[i])}: ${money(v)}`; rect.appendChild(t);
      svg.appendChild(rect);
    });
    return h("div", { class: "mult" },
      h("h4", { class: x === "Bonhams" ? "house-b" : "", style: x === "Bonhams" ? "color:var(--bonhams)" : "", text: HOUSE_NAME[x] }),
      h("p", { class: "peak", text: vals[peakI] ? `Peak month ${label(months[peakI])}, ${money(vals[peakI])}. Own scale.` : "No live sales captured in this window." }),
      svg,
      h("div", { class: "axis" }, h("span", { text: label(months[0]) }), h("span", { text: label(months[23]) })));
  });
  return h("section", { class: "block" },
    h("div", { class: "blockhead" }, h("div", null, h("h3", { text: "Live sale value by month" }),
      h("p", { text: "Last 24 months. Each house is drawn on its own scale so the calendar shape is visible; compare sizes in the share table above." }))),
    h("div", { class: "multiples" }, tiles));
}

function blockConcentration() {
  const fy = state.fy;
  const rows = (M().conc || []).filter(r => r[1] === fy);
  return h("section", { class: "block" },
    h("div", { class: "blockhead" }, h("div", null, h("h3", { text: `Reliance on top lots, ${fyLabel(fy)}` }),
      h("p", { text: "Share of each house's live value from its top 10% and top 5% of lots, and from its single top lot." }))),
    h("div", { class: "tablewrap" }, h("table", null,
      h("thead", null, h("tr", null, h("th", { text: "House" }), h("th", { text: "Top 10%" }), h("th", { text: "Top 5%" }), h("th", { text: "Top lot" }), h("th", { style: "text-align:left", text: "Top lot sold" }))),
      h("tbody", null, HOUSES.map(x => rows.find(r => r[0] === x)).filter(Boolean).map(r => {
        const url = safeUrl(r[8]);
        return h("tr", null,
          h("td", { class: r[0] === "Bonhams" ? "bonhams" : "", text: HOUSE_NAME[r[0]] }),
          h("td", { text: pct(r[4], 0) }), h("td", { text: pct(r[5], 0) }), h("td", { text: pct(r[6], 1) }),
          h("td", { class: "wrapcell" }, url ? h("a", { href: url, target: "_blank", rel: "noopener", text: niceTitle(r[7]) }) : niceTitle(r[7]), h("span", { class: "sh", text: money(r[9]) })));
      })))));
}

function blockOnline() {
  const fys = completeFys();
  const rows = fys.map(y => {
    const on = fyRows("Bonhams", y, "online"), lv = fyRows("Bonhams", y, "live");
    const ov = sum(on, r => r[7]), lvv = sum(lv, r => r[7]);
    return h("tr", null, h("td", { text: fyLabel(y) }), h("td", { text: sum(on, r => r[3]) }), h("td", { text: sum(on, r => r[5]).toLocaleString("en-AU") }),
      h("td", { text: money(ov) }), h("td", { text: pct(ov / (ov + lvv), 0) }), h("td", { text: sum(on, r => r[5]) ? money(ov / sum(on, r => r[5])) : "—" }));
  });
  return h("section", { class: "block" },
    h("div", { class: "blockhead" }, h("div", null, h("h3", { text: "Bonhams online jewellery sales" }),
      h("p", { text: "Excluded from market share, shown here so the full Bonhams calendar is visible." }))),
    h("div", { class: "tablewrap" }, h("table", null,
      h("thead", null, h("tr", null, h("th", { text: "Year" }), h("th", { text: "Sales" }), h("th", { text: "Lots sold" }), h("th", { text: "Value" }), h("th", { text: "Share of Bonhams total" }), h("th", { text: "Avg lot" }))),
      h("tbody", null, rows))));
}

/* ---------- controls + boot ---------- */
function syncControls() {
  document.querySelectorAll("[data-role]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.role === state.role)));
  document.querySelectorAll("[data-ccy]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.ccy === state.ccy)));
  const fx = (M().fx || [])[0];
  document.getElementById("basis").textContent = `Buyer's total, dedicated jewellery sales. ${state.ccy} at ECB rates of ${fx ? fmtDate(fx[2]) : "—"}.`;
}
function render() {
  const fys = completeFys();
  if (!fys.includes(state.fy)) state.fy = fys[fys.length - 1];
  syncControls(); renderTray(); renderMain();
}
document.querySelectorAll("[data-role]").forEach(b => b.addEventListener("click", () => { state.role = b.dataset.role; store.set("role", state.role); render(); }));
document.querySelectorAll("[data-ccy]").forEach(b => b.addEventListener("click", () => { state.ccy = b.dataset.ccy; store.set("ccy", state.ccy); render(); }));

render();
setStatus("idle", `Saved snapshot from ${fmtDate(SNAPSHOT.generated_at.slice(0, 10))}. Connecting to BARD…`);

(async () => {
  try { sample = window.claude && window.claude.use ? await window.claude.use("sample") : null; } catch (e) { sample = null; }
  if (sample) { try { const lim = await sample.limits(); sampleTools = !!(lim && lim.tools); } catch (e) { sampleTools = false; } }
  if (sample) renderTray();
})();
(async () => {
  try { mcp = window.claude && window.claude.use ? await window.claude.use("mcp") : null; } catch (e) { mcp = null; }
  if (!mcp) { setStatus("warn", `Showing the saved snapshot from ${fmtDate(SNAPSHOT.generated_at.slice(0, 10))}. Open this page in Claude with the Supabase connector for live data.`); return; }
  if (sample) renderTray();
  loadLive(false);
})();
</script>
</body>
